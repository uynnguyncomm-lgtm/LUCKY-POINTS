<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thiệp Mời Băng Giá - Tương Tác</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; 
      touch-action: none; 
    }

    /* Khung điện thoại 16:9 */
    .card-wrapper {
      position: relative;
      width: 360px;
      height: 640px; 
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 4px #1e293b;
      /* Background xanh lấp đầy khoảng trống của thiệp */
      background: #7bb1d9; 
    }

    /* Các lớp phủ absolute */
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Ảnh thiệp mời */
    .invitation-bg {
      z-index: 1;
      object-fit: contain; 
    }

    /* Lớp màng mờ che thiệp */
    #blue-veil {
      z-index: 2;
      background-image: url('lopbangmo.png');
      background-size: cover;
      background-position: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: opacity 1.5s ease-in-out;
      pointer-events: none;
    }

    /* Khung chứa hạt tuyết */
    #snow-container {
      z-index: 3; 
    }

    /* Canvas mặt băng */
    #scratchCanvas {
      z-index: 4;
      cursor: crosshair;
      transform: scale(1.18); 
      transition: opacity 1.5s ease-in-out;
    }

    /* Vùng chứa mảnh băng */
    #particles-container {
      z-index: 5;
      pointer-events: none;
    }

    /* Nút hướng dẫn */
    .hint-btn {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6; 
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      pointer-events: none; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      animation: bounceHint 1.5s infinite;
      transition: opacity 0.4s ease-out;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    @keyframes bounceHint {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }

    /* Lớp lóe sáng */
    .flash-overlay {
      position: fixed; 
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #ffffff; 
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
    }

    .shake-light {
      animation: shakeLight 0.2s ease-in-out;
    }
    @keyframes shakeLight {
      0%, 100% { transform: scale(1.18) translate(0, 0); }
      25% { transform: scale(1.18) translate(-3px, 2px) rotate(-0.5deg); }
      75% { transform: scale(1.18) translate(3px, -2px) rotate(0.5deg); }
    }

    .earthquake {
      animation: earthquakeShake 0.6s ease-in-out infinite;
    }
    @keyframes earthquakeShake {
      0%, 100% { transform: scale(1.18) translate(0, 0); }
      20% { transform: scale(1.18) translate(-6px, 4px) rotate(-1deg); }
      40% { transform: scale(1.18) translate(6px, -4px) rotate(1deg); }
      60% { transform: scale(1.18) translate(-4px, -6px) rotate(-1.5deg); }
      80% { transform: scale(1.18) translate(4px, 6px) rotate(1.5deg); }
    }

    .flash-animate {
      animation: freezeFlash 4s ease-out forwards; 
    }
    @keyframes freezeFlash {
      0% { opacity: 0; }
      10% { opacity: 1; }
      30% { opacity: 1; } 
      100% { opacity: 0; } 
    }

    .snowflake {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.5; }
      100% { transform: translateY(650px) translateX(20px); opacity: 0; }
    }

    .shard {
      position: absolute;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1), inset 0 0 5px rgba(255,255,255,0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <audio id="bgmAudio" src="Let It Go - Idina Menzel (Lyrics).mp3" loop preload="auto"></audio>
  <audio id="shineAudio" src="Shining SFX.mp3" preload="auto"></audio>
  
  <div class="card-wrapper" id="card">
    <img src="anh-thiep-moi.jpg" class="layer invitation-bg" id="invitationBg" 
         onerror="this.src='https://placehold.co/360x640/e2e8f0/475569?text=Loi+Anh+Thiep'">
    
    <div id="blue-veil" class="layer"></div>
    <div id="snow-container" class="layer pointer-events-none"></div>
    <canvas id="scratchCanvas" class="layer"></canvas>
    
    <div id="instruction-hint" class="hint-btn">Hãy chạm vào màn hình để phá băng</div>
    <div id="particles-container" class="layer"></div>
  </div>

  <div class="flash-overlay" id="flash"></div>

  <script>
    const snowContainer = document.getElementById('snow-container');
    function createSnow() {
      for (let i = 0; i < 20; i++) {
        let snow = document.createElement('div');
        snow.classList.add('snowflake');
        snow.style.left = Math.random() * 100 + '%';
        snow.style.width = Math.random() * 3 + 2 + 'px';
        snow.style.height = snow.style.width;
        snow.style.animationDuration = Math.random() * 3 + 2 + 's';
        snow.style.animationDelay = Math.random() * 2 + 's';
        snowContainer.appendChild(snow);
      }
    }
    createSnow();

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const width = 360;
    const height = 640;
    canvas.width = width;
    canvas.height = height;

    const iceImg = new Image();
    iceImg.src = 'anh-bang-nguyen.jpg';
    iceImg.onload = () => { ctx.drawImage(iceImg, 0, 0, width, height); };
    iceImg.onerror = () => {
      let gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#cbe5ff');
      gradient.addColorStop(1, '#e0f2fe');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    };

    let activeCrackSounds = [];

    function playCrackSound() {
      let crackSound = new Audio('Ice Cracking Sound Effect.mp3');
      activeCrackSounds.push(crackSound);
      crackSound.play().catch(e => console.log("Crack err:", e));
      
      crackSound.addEventListener('ended', () => {
        const index = activeCrackSounds.indexOf(crackSound);
        if(index > -1) activeCrackSounds.splice(index, 1);
      });
    }

    function stopAllCrackSounds() {
      activeCrackSounds.forEach(sound => {
        sound.pause();
        sound.currentTime = 0;
      });
      activeCrackSounds = [];
    }

    function drawCracks(x, y) {
      ctx.save();
      const branches = 6 + Math.floor(Math.random() * 4);
      
      for (let i = 0; i < branches; i++) {
        let angle = (Math.PI * 2 / branches) * i + (Math.random() * 0.5 - 0.25);
        let curX = x;
        let curY = y;
        let length = 70 + Math.random() * 60;

        ctx.beginPath();
        ctx.moveTo(curX, curY);

        for (let j = 0; j < 4; j++) {
          curX += Math.cos(angle) * (length / 4) + (Math.random() * 30 - 15);
          curY += Math.sin(angle) * (length / 4) + (Math.random() * 30 - 15);
          ctx.lineTo(curX, curY);
        }
        
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 0.6; 
        ctx.stroke();
      }

      ctx.globalCompositeOperation = 'destination-out';
      
      let radGrad = ctx.createRadialGradient(x, y, 20, x, y, 160);
      radGrad.addColorStop(0, 'rgba(0,0,0,1)');
      radGrad.addColorStop(0.4, 'rgba(0,0,0,0.8)');
      radGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = radGrad;
      ctx.beginPath();
      ctx.arc(x, y, 160, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      const points = 10;
      const radius = 120 + Math.random() * 40;
      for (let i = 0; i < points; i++) {
        let a = (Math.PI * 2 / points) * i;
        let r = radius - (Math.random() * 50);
        let px = x + Math.cos(a) * r;
        let py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    const particlesContainer = document.getElementById('particles-container');
    function spawnIceShards(x, y, count) {
      for (let i = 0; i < count; i++) {
        const shard = document.createElement('div');
        shard.classList.add('shard');
        
        const size = Math.random() * 15 + 8; 
        shard.style.width = size + 'px';
        shard.style.height = (size * 1.5) + 'px'; 
        
        const p1 = Math.random() * 30 + '%';
        const p2 = (70 + Math.random() * 30) + '%';
        shard.style.clipPath = `polygon(${p1} 0%, ${p2} 10%, 100% ${p2}, 80% 100%, 0% ${p1})`;

        particlesContainer.appendChild(shard);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 350 + 200; 
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity - 100; 
        const rot = Math.random() * 1440 - 720; 

        shard.animate([
          { transform: `translate(${x}px, ${y}px) rotate(0deg) scale(1)`, opacity: 1 },
          { transform: `translate(${x + tx}px, ${y + ty}px) rotate(${rot/2}deg) scale(1.2)`, opacity: 0.9, offset: 0.4 },
          { transform: `translate(${x + tx}px, ${y + ty + 300}px) rotate(${rot}deg) scale(0)`, opacity: 0 } 
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'cubic-bezier(0.2, 1, 0.3, 1)'
        }).onfinish = () => shard.remove(); 
      }
    }

    let tapCount = 0;
    const maxTaps = 6;
    let isRevealed = false;
    let isShaking = false;

    function handleInteraction(e) {
      if (isRevealed || isShaking) return;

      const hintBtn = document.getElementById('instruction-hint');
      if (hintBtn) hintBtn.style.opacity = '0';

      const rect = canvas.getBoundingClientRect();
      const scaleX = width / rect.width;
      const scaleY = height / rect.height;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      tapCount++;

      // TỪ NHÁT THỨ 1 ĐẾN 5: CHỈ ĐẬP VỠ VÀ KÊU TIẾNG BĂNG
      if (tapCount < maxTaps) {
        playCrackSound(); 
        
        canvas.classList.remove('shake-light');
        void canvas.offsetWidth;
        canvas.classList.add('shake-light');

        drawCracks(x, y);
        spawnIceShards(x, y, 10);
      } 
      // NHÁT ĐẬP CUỐI CÙNG: KHÔNG DÙNG HACK MUTE, KÍCH HOẠT NHẠC TRỰC TIẾP
      else {
        isShaking = true;
        drawCracks(x, y);

        // 1. Dừng ngay lập tức các tiếng lách cách đang kêu dở
        stopAllCrackSounds();

        // 2. GỌI LỆNH MỞ NHẠC TRỰC TIẾP (Trình duyệt sẽ cấp phép 100% vì đang nằm trong thao tác chạm của tay)
        const bgmAudio = document.getElementById('bgmAudio');
        const shineAudio = document.getElementById('shineAudio');
        
        bgmAudio.currentTime = 0;
        bgmAudio.play().catch(err => console.log("BGM Init Err:", err));
        
        shineAudio.currentTime = 0;
        shineAudio.play().catch(err => console.log("Shine Init Err:", err));

        // 3. Hiệu ứng động đất khi vỡ tung
        canvas.classList.add('earthquake');
        spawnIceShards(x, y, 60);
        
        let interval = setInterval(() => {
          spawnIceShards(width/2 + (Math.random()*100 - 50), height/2 + (Math.random()*100 - 50), 4);
        }, 100);

        // Hẹn giờ hiệu ứng chớp sáng chạy sau
        setTimeout(() => {
          clearInterval(interval);
          
          const flash = document.getElementById('flash');
          flash.classList.add('flash-animate');

          // Ẩn lớp băng ở thời điểm màn hình sáng nhất
          setTimeout(() => {
            canvas.style.opacity = '0'; 
            
            const blueVeil = document.getElementById('blue-veil');
            if (blueVeil) blueVeil.style.opacity = '0'; 
            
            canvas.classList.remove('earthquake'); 
            
            isRevealed = true;
            isShaking = false;
          }, 400); 

        }, 500); // Rung lắc 0.5s rồi mới lóe sáng
      }
    }

    canvas.addEventListener('mousedown', handleInteraction);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault(); 
      handleInteraction(e);
    }, { passive: false });
  </script>
</body>
</html>
